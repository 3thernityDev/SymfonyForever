app = 'symfonyforever'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'prod'
  APP_DEBUG = '0'
  DATABASE_URL = 'sqlite:////data/symfonyforever.db'
  LOCK_DSN = 'flock'
  DEFAULT_URI = 'https://symfonyforever.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/game/manifest'

[[mounts]]
  source = 'symfonyforever_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
